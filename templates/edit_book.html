{% extends "base.html" %}

{% block title %}
Edit Book - Library Management System
{% endblock %}

{% block content %}

<h1>✏️ Edit Book</h1>

<form method="POST">

    <p>
        <label>Title</label><br>
        <input
            type="text"
            name="title"
            value="{{ book.title }}"
            required
        >
    </p>

    <p>
        <label>Author</label><br>
        <input
            type="text"
            name="author"
            value="{{ book.author }}"
            required
        >
    </p>

    <p>
        <label>Genre</label><br>
        <input
            type="text"
            name="genre"
            value="{{ book.genre or '' }}"
        >
    </p>

    <p>
        <label>Published Year</label><br>
        <input
            type="number"
            name="published_year"
            value="{{ book.published_year or '' }}"
        >
    </p>

    <button type="submit" class="btn">
        Save Changes
    </button>

    <a href="{{ url_for('books') }}" class="btn">
        Cancel
    </a>

</form>

{% endblock %}
