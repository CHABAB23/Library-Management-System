{% extends "base.html" %}

{% block title %}
Edit Member - Library Management System
{% endblock %}

{% block content %}

<h1>✏️ Edit Member</h1>

<form method="POST">

    <p>
        <label>Name</label><br>
        <input
            type="text"
            name="name"
            value="{{ member.name }}"
            required
        >
    </p>

    <p>
        <label>Email</label><br>
        <input
            type="email"
            name="email"
            value="{{ member.email or '' }}"
        >
    </p>

    <p>
        <label>Phone Number</label><br>
        <input
            type="text"
            name="phone_number"
            value="{{ member.phone_number or '' }}"
        >
    </p>

    <p>
        <label>Join Date</label><br>
        <input
            type="date"
            name="join_date"
            value="{{ member.join_date or '' }}"
        >
    </p>

    <button type="submit" class="btn">
        Save Changes
    </button>

    <a href="{{ url_for('members') }}" class="btn">
        Cancel
    </a>

</form>

{% endblock %}
